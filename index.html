<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Circular, transparent-background crop of the same logo (GEARBNB_logo.png), generated
     specifically for the favicon — the source logo itself is an opaque square PNG (no alpha
     channel), which renders as a white square around the circle in a browser tab (no CSS
     rounding there, unlike its `rounded-full` usage elsewhere in the app). Never edit the source
     logo to "fix" this — everywhere else it's used deliberately relies on it being a plain
     rectangle clipped by CSS. -->
    <link rel="icon" type="image/png" href="/brand_assets/gearbnb-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camping Gear Rental in the Philippines | GearBnB</title>
    <meta name="description" content="Explore camping gear rental in the Philippines, serving Metro Manila, Las Piñas, and nearby cities. Find quality gear and book for your next adventure." />
    <!-- Meta Pixel Code. Loads ONLY after the visitor taps "Accept" on the cookie banner
         (src/components/CookieConsent.tsx), and only on the live site (gearbnbrental.com), so local
         development and previews never send test traffic. A returning visitor who already accepted
         gets it straight away here; the banner calls window.gearbnbLoadPixel() on Accept. Page
         changes inside the site are tracked by MetaPixelPageViews in src/App.tsx. -->
    <script>
      window.gearbnbLoadPixel = function () {
        if (!/(^|\.)gearbnbrental\.com$/.test(location.hostname) || window.fbq) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1784119539456234');
        fbq('track', 'PageView');
      };
      try {
        if (localStorage.getItem('gearbnb-cookie-consent') === 'granted') window.gearbnbLoadPixel();
      } catch (e) {}
    </script>
    <!-- End Meta Pixel Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
