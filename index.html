<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Circular, transparent-background crop of the same logo (GEARBNB_logo.png), generated
     specifically for the favicon — the source logo itself is an opaque square PNG (no alpha
     channel), which renders as a white square around the circle in a browser tab (no CSS
     rounding there, unlike its `rounded-full` usage elsewhere in the app). Never edit the source
     logo to "fix" this — everywhere else it's used deliberately relies on it being a plain
     rectangle clipped by CSS. -->
    <link rel="icon" type="image/png" href="/brand_assets/gearbnb-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camping Gear Rental in the Philippines | GearBnB</title>
    <meta name="description" content="Explore camping gear rental in the Philippines, serving Metro Manila, Las Piñas, and nearby cities. Find quality gear and book for your next adventure." />
    <script>
      (function () {
        // Default is light — only an explicit prior choice (the in-app toggle) turns this dark.
        // Deliberately does NOT fall back to prefers-color-scheme: a first-time visitor whose OS/
        // browser reports a dark preference must still see the site's intended light-mode default,
        // not have that decision made for them by an unrelated system setting they never chose
        // inside this app. Runs before <body> renders so there's no flash of the wrong theme.
        if (localStorage.getItem('gearbnb-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
